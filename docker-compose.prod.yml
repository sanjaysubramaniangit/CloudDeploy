# ==============================================================================
# CloudDeploy AI — Production Docker Compose Configuration (AWS EC2 + RDS)
# Omits local MySQL container; connects directly to private AWS RDS MySQL instance.
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Spring Boot Backend (Internal only — not exposed to host)
  # ----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-clouddeploy-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clouddeploy-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST (RDS endpoint) must be provided}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-clouddeploy}
      DB_USERNAME: ${DB_USERNAME:-clouddeploy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      DB_DIALECT: org.hibernate.dialect.MySQLDialect
      DB_USE_SSL: "true"
      DB_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET must be provided}
      AWS_S3_URL_DURATION: ${AWS_S3_URL_DURATION:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_FILE: /app/logs/app.log
    volumes:
      - /opt/clouddeploy/logs/backend:/app/logs
    networks:
      - clouddeploy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Frontend & Reverse Proxy (Sole host ingress on port 80)
  # ----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-clouddeploy-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: clouddeploy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    volumes:
      - /opt/clouddeploy/logs/nginx:/var/log/nginx
    networks:
      - clouddeploy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

# ------------------------------------------------------------------------------
# Isolated Internal Docker Network
# ------------------------------------------------------------------------------
networks:
  clouddeploy-net:
    driver: bridge

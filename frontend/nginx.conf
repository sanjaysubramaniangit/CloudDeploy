# Map to conditionally set Connection header based on Upgrade header presence.
# WebSocket requests get Connection: upgrade; REST requests use keep-alive.
map $http_upgrade $connection_upgrade {
    default keep-alive;
    "websocket" upgrade;
}

server {
    listen 8080;
    server_name localhost;

    # Stream access and error logs to container stdout and stderr
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Disable Nginx version banner
    server_tokens off;

    # Static assets root
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers (nosniff and SAMEORIGIN)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Single Page Application (SPA) fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy to Backend service
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for AI endpoints (interview, job match, assistant)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Support 10MB multipart uploads (resumes and build files)
        client_max_body_size 12M;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

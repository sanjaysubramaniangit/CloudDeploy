spring.application.name=CloudDeploy

# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clouddeploy}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.clouddeploy=DEBUG
logging.file.name=${LOG_FILE:}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.presigned-url-duration-minutes=${AWS_S3_URL_DURATION:15}

# AI Configuration (unconfigured by default)
ai.provider=${AI_PROVIDER:}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
# CORS Configuration
# CORS_ALLOWED_ORIGINS: Comma-separated list of allowed frontend origins.
# In production, set this env var to the EC2 public IP or custom domain.
# Example: CORS_ALLOWED_ORIGINS=http://your-ec2-ip,https://your-domain.com
# Default: http://localhost:5173 (local development only)


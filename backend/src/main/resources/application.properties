spring.application.name=CloudDeploy

# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clouddeploy}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.clouddeploy=DEBUG
logging.file.name=${LOG_FILE:}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.presigned-url-duration-minutes=${AWS_S3_URL_DURATION:15}

# AI Configuration (unconfigured by default)
ai.provider=${AI_PROVIDER:}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}


